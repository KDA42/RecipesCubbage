<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пекинская капуста - продажа и рецепты</title>
    <!-- Подключение шрифта Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Подключаем Mammoth.js с CDN -->
    <script src="mammoth.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🥬</span>
                <h1>Пекинская капуста</h1>
            </div>
            <p>Продажа оптом и в розницу</p>
            <nav>
                <a href="#contact">Контакты</a>
                <a href="#recipes">Рецепты</a>
            </nav>
        </div>
    </header>

    <main>
        <section id="contact" class="contact-section">
            <h2>Контактная информация</h2>
            <div class="contact-cards">
                <div class="contact-card">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
                    </svg>
                    <!-- Кликабельный номер телефона -->
                    <a href="tel:+79001234567">+7 (900) 123-45-67</a>
                </div>
                <div class="contact-card">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                        <polyline points="22,6 12,13 2,6" />
                    </svg>
                    <!-- Кликабельный email -->
                    <a href="mailto:info@peking-cabbage.ru">info@peking-cabbage.ru</a>
                </div>
                <div class="contact-card">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                        <circle cx="12" cy="10" r="3" />
                    </svg>
                    <!-- Адрес оставляем обычным текстом -->
                    <span>г. Москва, ул. Овощная, д. 10</span>
                </div>
            </div>
            <div class="map-container">
                <h3>Мы на карте</h3>
                <iframe src="https://yandex.ru/map-widget/v1/?ll=37.617635%2C55.755814&z=16&pt=37.617635%2C55.755814"
                    width="100%" height="400" frameborder="0" allowfullscreen="true"
                    style="border:0; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);"
                    loading="lazy"></iframe>
            </div>
        </section>
        </section>

        <section id="recipes" class="recipes-section">
            <h2>Книга рецептов с пекинской капустой</h2>
            <div id="recipes-container">
                <!-- Сюда будет вставлен HTML из документа -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Пекинская капуста. Все права защищены.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
